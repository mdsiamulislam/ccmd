name: ccmd
description: "This application is intended for authorized BCB officials, administrators, and internal users. It is not a public consumer application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Sate management
  get: ^4.7.3

  # UI & Design
  flutter_screenutil_plus: ^1.5.0
  lucide_icons_flutter: ^3.1.20
  google_fonts: ^8.2.1

  # Networking
  http: ^1.6.0

  # Local Storage
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/branding/


